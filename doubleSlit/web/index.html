<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Slit Experiment</title>
</head>
<body>
    <h1 id="status">Loading physics engine...</h1>

    <script src="doubleslit_wasm.js"></script>

    <script>
        createDoubleSlitModule().then((Module) => {
            const engine = new Module.DoubleSlitEngine();
            
            document.getElementById("status").textContent = 
                engine.status()
            
                engine.delete();
        });
    </script>
</body>
</html>
